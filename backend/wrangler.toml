name = "qltz-backend"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

[vars]
# ⚠️ 安全：JWT_SECRET 应通过 `wrangler secret put JWT_SECRET` 设置，不要写在配置文件中
# 开发环境临时使用请设置环境变量，切勿提交到 Git
ENABLE_DB_INIT = "true"

[[d1_databases]]
binding = "DB"
database_name = "qltz_db"
database_id = "b3bbe7a0-b4b2-4345-9c26-6b8fb3a4c899"

[triggers]
crons = ["* * * * *"]

[env.production]
vars = { NODE_ENV = "production", ENABLE_DB_INIT = "true" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "qltz_db"
database_id = "b3bbe7a0-b4b2-4345-9c26-6b8fb3a4c899"

[env.production.triggers]
crons = ["* * * * *"]

[env.development]
vars = { NODE_ENV = "development", ENABLE_DB_INIT = "true" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "qltz_db"
database_id = "b3bbe7a0-b4b2-4345-9c26-6b8fb3a4c899"

[env.development.triggers]
crons = ["* * * * *"]
